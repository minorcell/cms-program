        <svg id="home-line" viewBox="0 0 1920 5090" preserveAspectRatio="none">
            <defs>
                <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="25" result="blur1" />
                    <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur2" />
                    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur3" />
                    <feMerge>
                        <feMergeNode in="blur1" />
                        <feMergeNode in="blur2" />
                        <feMergeNode in="blur3" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
                <radialGradient id="sliderGradient" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
                    <stop offset="70%" stop-color="#ffffff" stop-opacity="0.8" />
                    <stop offset="100%" stop-color="#a0d8ff" stop-opacity="0.6" />
                </radialGradient>
            </defs>
            <path id="curve"
                d="M1788.94 1.79519C1788.94 1.79519 1593.58 54.4529 1348.08 236.453C1137.1 392.861 984.58 546.452 1016.94 821.795C1049.31 1097.14 1523.62 1075.54 1593.58 1381.45C1653.39 1642.97 1[...]"
                fill="none" stroke="rgba(255, 255, 255, 0.5)" stroke-width="0.8" />
            <ellipse id="slider" cx="0" cy="0" rx="25" ry="3" fill="url(#sliderGradient)" filter="url(#glow)" />

    <script src="./scripts/index/index.js"></script>
    <script>
        const curve = document.getElementById('curve')
        const slider = document.getElementById('slider')
        const totalHeight = document.documentElement.scrollHeight - window.innerHeight
        const speedFactor = 1.15

        function updateSlider() {
            const scrollY = window.scrollY
            const scrollFraction = scrollY / totalHeight
            const pathLength = curve.getTotalLength()
            const offset = scrollFraction * pathLength * speedFactor

            const point = curve.getPointAtLength(offset)
            const prevPoint = curve.getPointAtLength(Math.max(offset - 0.1, 0))
            const angle = Math.atan2(point.y - prevPoint.y, point.x - prevPoint.x) * 180 / Math.PI

            slider.setAttribute('transform', `translate(${point.x}, ${point.y}) rotate(${angle}`)
        }

        window.addEventListener('scroll', updateSlider)
        window.addEventListener('resize', updateSlider)
        updateSlider();
    </script>
